[project]
name = "p1-fc-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "HRW0820", email = "e1132297@u.nus.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
p1-fc-agent = "p1_fc_agent:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
